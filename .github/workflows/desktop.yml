name: Desktop native libraries

on:
  push:
    paths:
      - 'native/**'
      - 'lingua-core/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'lingua-core/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
            arch: aarch64
            java-arch: aarch64
            rust-target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
            java-arch: x64
            rust-target: x86_64-apple-darwin
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
            java-arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
          - platform: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
            java-arch: x64
            rust-target: x86_64-unknown-linux-gnu
          - platform: windows-aarch64
            runner: windows-11-arm
            arch: aarch64
            java-arch: aarch64
            rust-target: aarch64-pc-windows-msvc
          - platform: windows-x86_64
            runner: windows-2025
            arch: x86_64
            java-arch: x64
            rust-target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java-arch }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Set up native Rust toolchain
        run: |
          rustup toolchain install stable-${{ matrix.rust-target }} --profile minimal
          rustup default stable-${{ matrix.rust-target }}
          rustup target add ${{ matrix.rust-target }}
      - name: Build and test desktop JARs
        run: |
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' \
            -Plingua.desktopOnly=true -Plingua.desktopArch=${{ matrix.arch }} \
            :lingua-core:desktopTest :lingua-core:desktopPackagedTest
      - name: Test Rust bridge
        run: |
          cargo test --manifest-path native/Cargo.toml --locked --release \
            --target ${{ matrix.rust-target }} --target-dir lingua-core/build/rust/desktop
      - name: Upload platform native JAR
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: lingua-core/build/libs/*-natives-${{ matrix.platform }}.jar
          if-no-files-found: error
          compression-level: 0
      - name: Upload portable JVM JAR
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-jvm
          path: |
            lingua-core/build/libs/lingua-core-desktop-[0-9]*.jar
            !lingua-core/build/libs/*-natives-*.jar
            !lingua-core/build/libs/*-sources.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-tests-${{ matrix.platform }}
          path: lingua-core/build/reports/tests/
          if-no-files-found: ignore
